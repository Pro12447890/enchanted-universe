<style>
  :root { color-scheme: dark; --line: #24242e; --soft: #8f8fa8; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; min-height: 100%;
         padding: clamp(10px, 2.2vh, 24px) clamp(10px, 2.4vw, 28px);
         display: flex; justify-content: center; align-items: center;
         background: radial-gradient(1100px 600px at 8% -12%, #16162a 0%, rgba(11,11,16,0) 62%),
                     radial-gradient(900px 520px at 100% 110%, #131322 0%, rgba(11,11,16,0) 60%),
                     #0b0b10;
         color: #d8d8e0; font: 14px/1.45 "Segoe UI", system-ui, -apple-system, sans-serif; }
  .page { width: 100%; max-width: 980px; display: flex; flex-direction: column;
          gap: clamp(10px, 1.8vh, 18px); }
  header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: clamp(15px, 1.45vw, 19px); font-weight: 600; margin: 0; letter-spacing: .2px; }
  h1 span { opacity: .45; font-weight: 400; }
  .back { margin-left: auto; font-size: 12.5px; color: var(--soft); text-decoration: none;
          padding: 5px 11px; border: 1px solid #262634; border-radius: 999px;
          background: #101018; white-space: nowrap; }
  .back:hover { color: #e8e8f2; border-color: #3c3c50; }
  .workspace { display: grid; grid-template-columns: minmax(0, 1fr) minmax(250px, 318px);
               gap: clamp(12px, 1.8vw, 22px); align-items: start; }
  .stage { width: 100%; max-width: min(100%, max(58vh, 44vw)); margin-inline: auto; aspect-ratio: 1 / 1;
           padding: clamp(6px, .9vw, 12px); display: grid; place-items: center;
           background: radial-gradient(120% 120% at 30% 18%, #0d0d17 0%, #06060a 72%);
           border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 18px 44px -30px #000; }
  canvas { display: block; width: 100%; height: auto; aspect-ratio: 1 / 1;
           image-rendering: pixelated; border-radius: 10px; }
  .panel { display: flex; flex-direction: column; gap: 9px; padding: clamp(10px, 1.2vw, 16px);
           background: rgba(15, 15, 23, .72); border: 1px solid var(--line); border-radius: 14px; }

  #info { font: 12px/1.5 ui-monospace, Consolas, monospace; color: #9a9ab0;
          white-space: pre-wrap; margin: 4px 0 0; }
  @media (max-width: 900px), (max-height: 500px) {
    body { align-items: flex-start; }

  }
  @media (max-width: 420px) { label { flex-wrap: wrap; } }
  @media (min-width: 1500px) { .page { max-width: 1240px; } }

<body>
<div class="page">
  <header>
    <h1>Генератор планет <span>— enchanted universe</span></h1>
    <a class="back" href="https://enchanted.daymix.dpdns.org/">← на сайт</a>
  </header>
  <main class="workspace">
    <div class="stage"><canvas id="cv" width="256" height="256"></canvas></div>
    <aside class="panel">
      <label>Сид <input id="seed" type="number" value="7" step="1"></label>
      <button id="rnd">Случайный сид</button>
      <label>Тип <select id="type">
        <option value="gas">газовый гигант</option>
        <option value="rocky">каменная</option>
      </select></label>
      <label>Температура, °C
        <span style="display:flex;gap:6px;align-items:center">
          <input id="temp" type="range" min="-220" max="2600" value="-60" step="10" style="width:104px">
          <b id="tempv">-60</b>
        </span></label>
      <label>Размер <select id="size">
        <option>128</option><option selected>256</option><option>512</option>
      </select></label>
      <label>Пиксель <select id="pix">
        <option value="auto" selected>авто</option>
        <option value="1">1</option><option value="2">2</option><option value="4">4</option>
      </select></label>
      <label><span>Наклон полос</span>
        <input id="tilt" type="range" min="0" max="60" value="0" step="1" style="width:104px"></label>
      <button id="save">Скачать PNG</button>
      <pre id="info"></pre>
    </aside>
  </main>

<script>
"use strict";
/* ---------------------------------------------------------------------------
   Порт PlanetIconGenerator: те же палитры, шум, пояса, вихри, нагрев и свет.
   Отличие от игры одно: хеш вариативности здесь 32-битный (в игре 64-битный),
   поэтому конкретные планеты при том же сиде другие, а алгоритм — тот же.
--------------------------------------------------------------------------- */

const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");

const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const shade = (c, k) => [clamp(c[0] * k, 0, 255), clamp(c[1] * k, 0, 255), clamp(c[2] * k, 0, 255)];
const adjust = (c, d) => [clamp(c[0] + d, 0, 255), clamp(c[1] + d, 0, 255), clamp(c[2] + d, 0, 255)];
const lerp = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
const addc = (c, a, k) => [clamp(c[0] + a[0] * k, 0, 255), clamp(c[1] + a[1] * k, 0, 255), clamp(c[2] + a[2] * k, 0, 255)];
const hex = (h) => [(h >> 16) & 255, (h >> 8) & 255, h & 255];

function h01(seed, salt) {
  const s = Math.sin(seed * 12.9898 + salt * 78.233) * 43758.5453;
  return s - Math.floor(s);
}

/* --- шум: ровно как в PlanetIconGenerator ---------------------------------- */
function noise(x, y, seed) {
  const s = Math.sin(x * 12.9898 + y * 78.233 + (seed % 65536)) * 43758.5453;
  return s - Math.floor(s);
}
function smoothNoise(x, y, seed) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const n00 = noise(xi, yi, seed), n10 = noise(xi + 1, yi, seed);
  const n01 = noise(xi, yi + 1, seed), n11 = noise(xi + 1, yi + 1, seed);
  const a = n00 + (n10 - n00) * u, b = n01 + (n11 - n01) * u;
  return a + (b - a) * v;
}
function fbm(x, y, seed) {
  return smoothNoise(x, y, seed) * 0.55
       + smoothNoise(x * 2.1 + 5.3, y * 2.1 + 1.7, seed + 31) * 0.28
       + smoothNoise(x * 4.3 + 9.1, y * 4.3 + 3.3, seed + 67) * 0.17;
}

/* --- HSV: процедурная палитра ---------------------------------------------- */
function rgb2hsv(c) {
  const r = c[0] / 255, g = c[1] / 255, b = c[2] / 255;
  const max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min;
  let h = 0;
  if (d > 1e-5) {
    if (max === r) h = ((g - b) / d) % 6;
    else if (max === g) h = (b - r) / d + 2;
    else h = (r - g) / d + 4;
    h *= 60;
    if (h < 0) h += 360;
  }
  return [h, max <= 0 ? 0 : d / max, max];
}
function hsv2rgb(h, s, v) {
  const c = v * s, x = c * (1 - Math.abs(((h / 60) % 2) - 1)), m = v - c;
  let r = 0, g = 0, b = 0;
  const seg = Math.floor(h / 60) % 6;
  if (seg === 0) { r = c; g = x; } else if (seg === 1) { r = x; g = c; }
  else if (seg === 2) { g = c; b = x; } else if (seg === 3) { g = x; b = c; }
  else if (seg === 4) { r = x; b = c; } else { r = c; b = x; }
  return [(r + m) * 255, (g + m) * 255, (b + m) * 255];
}
function tint(c, hueDeg, satMul, valMul) {
  const hsv = rgb2hsv(c);
  return hsv2rgb((hsv[0] + hueDeg + 360) % 360, clamp(hsv[1] * satMul, 0, 1), clamp(hsv[2] * valMul, 0, 1));
}

const GAS = [
  0xD8B685, 0x9E6538, // песочный
  0x6FC8D8, 0x2E7C9A, // бирюзовый
  0xD88A9A, 0x8A3A5A, // розово-бордовый
  0xC8A0E0, 0x6A4A9A, // фиолетовый
  0xE8C060, 0xA06028, // золотой
  0x8AC8A0, 0x3A7A5A, // зелёный
];
const HEAT = [[0x8A, 0x0A, 0x00], [0xD8, 0x30, 0x00], [0xB0, 0x12, 0x00], [0xE0, 0x80, 0x00],
              [0xFF, 0xD0, 0x40], [0xFF, 0xFF, 0xFF], [0xFF, 0xF0, 0xB0]];
const HEAT_AT = [0, 0.22, 0.38, 0.52, 0.66, 0.82, 1];
function heatColor(h) {
  for (let i = 0; i < HEAT_AT.length - 1; i++) {
    if (h <= HEAT_AT[i + 1]) {
      const t = (h - HEAT_AT[i]) / Math.max(0.001, HEAT_AT[i + 1] - HEAT_AT[i]);
      return lerp(HEAT[i], HEAT[i + 1], t);
    }
  }
  return HEAT[HEAT.length - 1];
}

/* --- параметры мира из сида ------------------------------------------------- */
function gasParams(seed, tempC, size) {
  const s = Math.abs(Math.floor(seed)) || 1;
  const fam = (s % 6) * 2;
  const hue = h01(s, 1) * 44 - 22;
  const sat = 0.80 + h01(s, 2) * 0.40;
  const val = 0.88 + h01(s, 3) * 0.26;
  const climate = tempC < 150 ? [159, 216, 255]
    : tempC < 350 ? [220, 232, 242]
    : tempC < 800 ? [90, 74, 154]
    : tempC < 1300 ? [138, 42, 42] : [200, 90, 24];
  const p = {
    base: lerp(tint(hex(GAS[fam]), hue, sat, val), climate, 0.18),
    detail: lerp(tint(hex(GAS[fam + 1]), hue, sat, val), climate, 0.22),
    bandFreq: 14 + Math.floor(h01(s, 4) * 22),
    distort: 0.55 + h01(s, 5) * 1.5,
    softness: h01(s, 6),
    widenAmp: 0.45 + h01(s, 7) * 0.55,
    spots: [], smalls: [],
    hex: false,
    heatG: 0, heatRgb: [0, 0, 0],
  };
  p.heatG = Math.pow(clamp((tempC - 900) / 1400, 0, 1), 0.7);
  p.heatRgb = heatColor(clamp((tempC - 900) / 1800, 0, 1));
  p.hex = h01(s, 8) < 0.10 && tempC >= -150 && tempC <= 10;

  const radius = size / 2 - 2;
  const storms = 1 + Math.floor(h01(s, 9) * 3);
  for (let i = 0; i < storms; i++) {
    const a = h01(s, 20 + i * 5) * Math.PI * 2;
    const d = radius * (0.20 + h01(s, 21 + i * 5) * 0.26);
    const rx = size * (0.045 + h01(s, 22 + i * 5) * 0.045);
    const ry = rx * (0.50 + h01(s, 23 + i * 5) * 0.24);
    p.spots.push({ x: Math.cos(a) * d, y: Math.sin(a) * d * 0.62, rx, ry,
                   u: Math.cos(a) * d / size, v: Math.sin(a) * d * 0.62 / size,
                   ru: rx / size, rv: ry / size });
  }
  const nSmall = 2 + Math.floor(h01(s, 10) * 4);
  for (let i = 0; i < nSmall; i++) {
    const a = h01(s, 40 + i * 4) * Math.PI * 2;
    const d = radius * (0.15 + h01(s, 41 + i * 4) * 0.55);
    p.smalls.push({ x: Math.cos(a) * d, y: Math.sin(a) * d * 0.8,
                    rx: size * (0.012 + h01(s, 42 + i * 4) * 0.018),
                    ry: size * (0.008 + h01(s, 43 + i * 4) * 0.012) });
  }
  return p;
}

function rockyParams(seed, tempC, size) {
  const s = Math.abs(Math.floor(seed)) || 1;
  const hot = tempC > 250;
  const icy = tempC < -80;
  const p = hot
    ? { base: [138, 66, 42], detail: [168, 86, 56], ocean: [56, 20, 14], dry: true, caps: false, cap: 1 }
    : icy
      ? { base: [200, 228, 240], detail: [232, 246, 252], ocean: [31, 53, 72], dry: false, caps: true, cap: 0.5 }
      : { base: [69, 104, 78], detail: [94, 140, 104], ocean: [24, 56, 92], dry: false, caps: true, cap: 0.7 };
  const hue = h01(s, 11) * 40 - 20;
  p.base = tint(p.base, hue, 0.85 + h01(s, 12) * 0.3, 0.9 + h01(s, 13) * 0.2);
  p.detail = tint(p.detail, hue, 0.85 + h01(s, 12) * 0.3, 0.9 + h01(s, 13) * 0.2);
  p.continentFreq = 3.6 + h01(s, 14) * 2.4;
  p.detailFreq = 5.0 + h01(s, 15) * 2.1;
  p.landThreshold = 0.46 + h01(s, 16) * 0.12;
  return p;
}

/* --- отрисовка -------------------------------------------------------------- */
function pixelSizeFor(kind, size) {
  const sel = document.getElementById("pix").value;
  if (sel !== "auto") return parseInt(sel, 10);
  return kind === "gas" ? Math.max(1, Math.round(size / 256)) : Math.max(2, Math.round(size / 32));
}

function render(size, seed, tempC, kind, tiltDeg) {
  const pixel = pixelSizeFor(kind, size);
  const radius = size / 2 - 2;
  const cx = size / 2, cy = size / 2;
  const tilt = tiltDeg * Math.PI / 180;
  const ca = Math.cos(tilt), sa = Math.sin(tilt);
  const img = ctx.createImageData(size, size);
  const data = img.data;

  const P = kind === "gas" ? gasParams(seed, tempC, size) : rockyParams(seed, tempC, size);

  for (let y = 0; y < size; y += pixel) {
    for (let x = 0; x < size; x += pixel) {
      const dx = x - cx + pixel / 2, dy = y - cy + pixel / 2;
      if (dx * dx + dy * dy > radius * radius) continue;

      const nx = x / size, ny = y / size;
      const hu = (ca * (x - cx) - sa * (y - cy)) / size;
      const hv = (sa * (x - cx) + ca * (y - cy)) / size;
      let col;

      if (kind === "gas") {
        let gu = hu, gv = hv;
        for (const sp of P.spots) {
          const du = (hu - sp.u) / sp.ru, dv = (hv - sp.v) / sp.rv;
          const dd = du * du + dv * dv;
          if (dd >= 6) continue;
          const tw = 1.3 * Math.exp(-dd * 1.3);
          const c2 = Math.cos(tw), s2 = Math.sin(tw);
          const r1 = hu - sp.u, r2 = hv - sp.v;
          gu = sp.u + r1 * c2 - r2 * s2;
          gv = sp.v + r1 * s2 + r2 * c2;
        }
        const q1 = fbm(gu * 2.6 + 11, gv * 5 + 5, seed ^ 0x51AB) - 0.5;
        const q2 = fbm(gu * 5.5 + 3, gv * 11 + 9, seed ^ 0x99CD) - 0.5;
        gv += (q1 * 0.030 + q2 * 0.010) * P.distort;

        const widen = 1 + (fbm(gu * 1.5 + 12.3, gv * 1.5 + 5.1, seed ^ 0x77C1) - 0.5) * P.widenAmp;
        const n = (gv + 0.5) * P.bandFreq * widen + seed * 0.02;
        const wave = Math.sin(n);
        const t = wave * 0.5 + 0.5;
        if (t > 0.88) col = adjust(P.base, 30);
        else if (t > 0.58) col = P.base;
        else if (t > 0.36) col = lerp(P.base, P.detail, 0.45);
        else if (t > 0.15) col = lerp(P.base, P.detail, 0.85);
        else col = adjust(P.detail, -14);

        if (P.softness > 0.01) col = lerp(col, lerp(P.detail, P.base, t), P.softness * 0.65);

        // градиенты: поперёк пояса, по широте, полярная пелена
        col = shade(col, 0.95 + 0.10 * t);
        const lat = Math.abs(dy) / radius;
        col = shade(col, 1 - 0.18 * lat * lat);
        const polar = clamp((lat - 0.78) / 0.22, 0, 1);
        col = lerp(col, adjust(P.detail, -30), 0.35 * polar);

        if (P.hex) {
          const hx = (x - cx) / (size * 0.13), hy = (y - cy + radius * 0.86) / (size * 0.062);
          const hd = Math.max(Math.abs(hy), 0.866 * Math.abs(hx) + 0.5 * Math.abs(hy));
          if (hd < 1.25) {
            let k = clamp((1.25 - hd) / 0.45, 0, 1);
            k = k * k * (3 - 2 * k);
            col = lerp(col, adjust(P.detail, -25), 0.45 * k);
            const rim = clamp((hd - 0.75) / 0.30, 0, 1) * clamp((1.20 - hd) / 0.25, 0, 1);
            col = adjust(col, 22 * rim);
          }
        }
        for (const sm of P.smalls) {
          const ex = (x - cx - sm.x) / sm.rx, ey = (y - cy - sm.y) / sm.ry;
          const d2 = ex * ex + ey * ey;
          if (d2 < 1) col = lerp(col, adjust(P.detail, 28), 0.45 * (1 - d2) * (1 - d2));
        }
        for (const sp of P.spots) {
          const ex = (x - cx - sp.x) / sp.rx, ey = (y - cy - sp.y) / sp.ry;
          const d2 = ex * ex + ey * ey;
          if (d2 > 1) continue;
          const cu = (hu - sp.u) / (sp.ru * 0.30), cv = (hv - sp.v) / (sp.rv * 0.30);
          if (cu * cu + cv * cv < 1) col = adjust(col, 16);
          else col = lerp(col, lerp(P.detail, P.base, 0.30), 0.55 * (1 - d2) * (1 - d2));
        }
        // цвет пояса гуляет вдоль полосы
        col = adjust(col, (fbm(gu * 2.2 + 3, gv * 2.2 + 7, seed ^ 0xAB12) - 0.5) * 30);

        // раскалённые пояса
        let heatLit = false;
        if (P.heatG > 0.01 && wave > 0.55) {
          const bg = P.heatG * clamp((wave - 0.55) / 0.45, 0, 1);
          const kk = (0.30 + 0.70 * bg) * (0.55 + 0.45 * bg);
          col = addc(col, P.heatRgb, kk);
          heatLit = true;
        }
        // облака и ветер
        col = clouds(col, gu, gv, seed);
        let light = Math.max(0.30, 0.95 - Math.sqrt(dx * dx + dy * dy) / radius * 0.45
                             - Math.max(0, dx / radius) * 0.22);
        if (heatLit) light = 1;
        light *= relief(gu, gv, seed);
        col = shade(col, light);
      } else {
        // каменная планета
        const wob = (fbm(nx * 3.4 + 31, ny * 3.4 + 17, seed ^ 0x6B6B) - 0.5) * 0.9;
        const n = smoothNoise(nx * P.continentFreq + wob, ny * P.continentFreq + wob * 0.7, seed);
        const n3 = smoothNoise(nx * P.detailFreq + 20, ny * P.detailFreq + 20, seed);
        const land = n > (P.dry ? 0.25 : P.landThreshold);
        const l3 = n3 > 0.58 && n3 < 0.85;
        col = P.dry ? P.base : P.ocean;
        if (P.dry) { if (land) col = P.detail; if (l3) col = adjust(P.detail, -20); }
        else if (land && l3) col = P.detail;
        else if (land) col = lerp(P.base, P.detail, 0.5);
        if (P.caps) {
          const en = smoothNoise(nx * 18, ny * 18, seed) - 0.5;
          const edge = radius * P.cap + en * radius * 0.08;
          if (Math.abs(dy) > edge) col = lerp(col, [234, 246, 255], 0.75);
        }
        col = clouds(col, nx, ny, seed, false);
        const dist = Math.sqrt(dx * dx + dy * dy) / radius;
        let light = Math.max(0.30, 0.95 - dist * 0.45 - Math.max(0, dx / radius) * 0.22);
        light *= relief(nx, ny, seed, false);
        col = shade(col, light);
      }

      const r = clamp(col[0] | 0, 0, 255), g = clamp(col[1] | 0, 0, 255), b = clamp(col[2] | 0, 0, 255);
      for (let py = 0; py < pixel; py++) {
        for (let px = 0; px < pixel; px++) {
          const tx = x + px, ty = y + py;
          if (tx >= size || ty >= size) continue;
          const i = (ty * size + tx) * 4;
          data[i] = r; data[i + 1] = g; data[i + 2] = b; data[i + 3] = 255;
        }
      }
    }
  }
  return img;
}

function relief(hu, hv, seed, gas = true) {
  const v = gas
    ? fbm(hu * 6 + 21, hv * 26 + 14, seed ^ 0x2B2B) * 0.62 + fbm(hu * 2.5 + 5, hv * 14 + 3, seed ^ 0x7E77) * 0.38
    : fbm(hu * 5.5 + 21, hv * 5.5 + 14, seed ^ 0x2B2B);
  return 0.92 + v * 0.16;
}

function clouds(col, hu, hv, seed, gas = true) {
  const scale = gas ? 9 : 4.2;
  const wx = hu * scale + (fbm(hu * 2.2 + 9, hv * 2.2 + 2, seed ^ 0x1234) - 0.5) * 1.5;
  const wy = hv * scale + (fbm(hu * 2.2 + 3, hv * 2.2 + 7, seed ^ 0x5678) - 0.5) * 1.5;
  const c = fbm(wx, wy, seed ^ 0xC10D);
  const thr = gas ? 0.56 : 0.62;
  if (c > thr) return lerp(col, [242, 247, 255], Math.min(gas ? 0.12 : 0.26, (c - thr) / (1 - thr) * (gas ? 0.26 : 0.44)));
  if (c > thr - 0.09) return lerp(col, [20, 23, 27], (thr - c) / 0.09 * 0.06);
  return col;
}

/* --- панель ----------------------------------------------------------------- */
function current() {
  return {
    seed: parseInt(document.getElementById("seed").value, 10) || 1,
    tempC: parseFloat(document.getElementById("temp").value),
    size: parseInt(document.getElementById("size").value, 10),
    kind: document.getElementById("type").value,
    tilt: parseFloat(document.getElementById("tilt").value),
  };
}

function draw() {
  const c = current();
  cv.width = c.size;
  cv.height = c.size;
  const img = render(c.size, c.seed, c.tempC, c.kind, c.tilt);
  ctx.putImageData(img, 0, 0);
  const P = c.kind === "gas" ? gasParams(c.seed, c.tempC, c.size) : rockyParams(c.seed, c.tempC, c.size);
  const info = c.kind === "gas"
    ? `сид ${c.seed} · газовый гигант\n` +
      `поясов ${P.bandFreq} · искажение ${P.distort.toFixed(2)} · ровность ${P.softness.toFixed(2)}\n` +
      `ширина ${P.widenAmp.toFixed(2)} · вихрей ${P.spots.length} · пятен ${P.smalls.length}\n` +
      `шестиугольник ${P.hex ? "есть" : "нет"} · нагрев ${P.heatG > 0.01 ? (P.heatG * 100).toFixed(0) + " %" : "нет"}`
    : `сид ${c.seed} · каменная планета\n` +
      `материки ${P.continentFreq.toFixed(2)} · детали ${P.detailFreq.toFixed(2)}\n` +
      `порог суши ${P.landThreshold.toFixed(2)} · шапки ${P.caps ? "есть" : "нет"}`;
  document.getElementById("info").textContent = info;
}

["seed", "temp", "size", "pix", "type", "tilt"].forEach((id) =>
  document.getElementById(id).addEventListener("input", () => {
    document.getElementById("tempv").textContent = document.getElementById("temp").value;
    draw();
  }));

document.getElementById("rnd").addEventListener("click", () => {
  document.getElementById("seed").value = Math.floor(Math.random() * 999999) + 1;
  draw();
});

document.getElementById("save").addEventListener("click", () => {
  cv.toBlob((blob) => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    const c = current();
    a.download = `planet_${c.kind}_${c.seed}_${c.size}.png`;
    a.click();
    URL.revokeObjectURL(a.href);
  });
});

document.getElementById("tempv").textContent = document.getElementById("temp").value;
draw();
</script>
