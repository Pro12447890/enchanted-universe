<style>
  :root { color-scheme: dark; --line: #24242e; --soft: #8f8fa8; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; min-height: 100%;
         padding: clamp(10px, 2.2vh, 24px) clamp(10px, 2.4vw, 28px);
         display: flex; justify-content: center; align-items: center;
         background: radial-gradient(1100px 600px at 8% -12%, #16162a 0%, rgba(11,11,16,0) 62%),
                     radial-gradient(900px 520px at 100% 110%, #131322 0%, rgba(11,11,16,0) 60%),
                     #0b0b10;
         color: #d8d8e0; font: 14px/1.45 "Segoe UI", system-ui, -apple-system, sans-serif; }
  .page { width: 100%; max-width: 980px; display: flex; flex-direction: column;
          gap: clamp(10px, 1.8vh, 18px); }
  header { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  h1 { font-size: clamp(15px, 1.45vw, 19px); font-weight: 600; margin: 0; letter-spacing: .2px; }
  h1 span { opacity: .45; font-weight: 400; }
  .back { margin-left: auto; font-size: 12.5px; color: var(--soft); text-decoration: none;
          padding: 5px 11px; border: 1px solid #262634; border-radius: 999px;
          background: #101018; white-space: nowrap; }
  .back:hover { color: #e8e8f2; border-color: #3c3c50; }
  .workspace { display: grid; grid-template-columns: minmax(0, 1fr) minmax(250px, 318px);
               gap: clamp(12px, 1.8vw, 22px); align-items: start; }
  .stage { width: 100%; max-width: min(100%, max(58vh, 44vw)); margin-inline: auto; aspect-ratio: 1 / 1;
           padding: clamp(6px, .9vw, 12px); display: grid; place-items: center;
           background: radial-gradient(120% 120% at 30% 18%, #0d0d17 0%, #06060a 72%);
           border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 18px 44px -30px #000; }
  canvas { display: block; width: 100%; height: auto; aspect-ratio: 1 / 1;
           image-rendering: pixelated; border-radius: 10px; }
  .panel { display: flex; flex-direction: column; gap: 9px; padding: clamp(10px, 1.2vw, 16px);
           background: rgba(15, 15, 23, .72); border: 1px solid var(--line); border-radius: 14px; }
  label { display: flex; align-items: center; gap: 10px; justify-content: space-between;
          font-size: 13px; color: #c4c4d4; }
  input[type=number] { width: 108px; }
  input, select, button { background: #16161e; color: #e6e6ee; border: 1px solid #2c2c38;
                          border-radius: 7px; padding: 6px 9px; font: inherit; }
  input[type=range] { padding: 0; border: 0; background: none; accent-color: #7f7fff; }
  button { cursor: pointer; }

  #rnd, #save { width: 100%; }
  #tempv { min-width: 52px; text-align: right; font-variant-numeric: tabular-nums; }
  #fieldv, #magtiltv { min-width: 58px; text-align: right;
                       font-variant-numeric: tabular-nums; }
  #fieldv { min-width: 62px; }
  .row { display: flex; align-items: center; gap: 6px; justify-content: flex-end; }
  .note { margin: -3px 0 0; font-size: 11.5px; line-height: 1.35; color: var(--soft); }
  #info { font: 12px/1.5 ui-monospace, Consolas, monospace; color: #9a9ab0;
          white-space: pre-wrap; margin: 4px 0 0; }
  @media (max-width: 900px), (max-height: 500px) {
    body { align-items: flex-start; }
    .workspace { grid-template-columns: 1fr; }
  }
  #langBtn { margin-left: 0; }
  @media (max-width: 420px) { label { flex-wrap: wrap; } }
  @media (min-width: 1500px) { .page { max-width: 1240px; } }

<body>
<div class="page">
  <header>
    <h1><span data-i18n="p.title">Генератор планет</span> <span>— enchanted universe</span></h1>
    <a class="back" href="./" data-i18n="p.back">← на сайт</a>
    <button id="langBtn" class="back" type="button" aria-label="Язык">RU</button>
  </header>
  <main class="workspace">
    <div class="stage"><canvas id="cv" width="256" height="256"></canvas></div>
    <aside class="panel">
      <label><span data-i18n="p.seed">Сид</span> <input id="seed" type="number" value="7" step="1"></label>
      <button id="rnd" data-i18n="p.random">Случайный сид</button>
      <label><span data-i18n="p.type">Тип</span> <select id="type">
        <option value="gas" data-i18n="p.gas">газовый гигант</option>

      <label><span data-i18n="p.cloudtype">Тип облаков</span> <select id="cloudtype">

        </select></label>
      <label><span data-i18n="p.field">Магнитное поле</span>
        <span class="row"><input id="field" type="range" min="0" max="5" value="0.5" step="0.05" style="width:96px">
          <b id="fieldv">0,50 Гс</b></span></label>
      <label><span data-i18n="p.magtilt">Наклон поля</span>
        <span class="row"><input id="magtilt" type="range" min="-30" max="30" value="0" step="1" style="width:96px">
          <b id="magtiltv">0°</b></span></label>
      <p class="note" data-i18n="p.aur.note">сияние: планета на 1 а.е. у звезды G2</p>

<script src="js/i18n.js"></script>

<script src="js/aurora.js?v=1"></script>
<script>
"use strict";
const T = (k, v) => EUI18N.t(k, v);
/* ---------------------------------------------------------------------------
   Порт PlanetIconGenerator: те же палитры, шум, пояса, вихри, нагрев и свет.
   Отличие от игры одно: хеш вариативности здесь 32-битный (в игре 64-битный),
   поэтому конкретные планеты при том же сиде другие, а алгоритм — тот же.
--------------------------------------------------------------------------- */

const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");

/* Атмосфера и магнитное поле: та же модель, что в моде.
   Сияние считается для планеты на 1 а.е. у звезды G2 (a = 1). */
// Видимость овала считается в js/aurora.js (EUAurora.nightVisibility); дубль удалён.
// Ореол считается по атмосферной модели (atmosphereModel); вторая таблица удалена.
const AURORA_MS = 14000;
const AUR_GREEN = [120, 245, 185], AUR_BLUE = [130, 165, 255], AUR_HOT = [190, 255, 220];
const reduceMotion = window.matchMedia
  ? window.matchMedia("(prefers-reduced-motion: reduce)")
  : { matches: false };

const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const shade = (c, k) => [clamp(c[0] * k, 0, 255), clamp(c[1] * k, 0, 255), clamp(c[2] * k, 0, 255)];
const adjust = (c, d) => [clamp(c[0] + d, 0, 255), clamp(c[1] + d, 0, 255), clamp(c[2] + d, 0, 255)];
const lerp = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
const addc = (c, a, k) => [clamp(c[0] + a[0] * k, 0, 255), clamp(c[1] + a[1] * k, 0, 255), clamp(c[2] + a[2] * k, 0, 255)];
const hex = (h) => [(h >> 16) & 255, (h >> 8) & 255, h & 255];

function h01(seed, salt) {
  const s = Math.sin(seed * 12.9898 + salt * 78.233) * 43758.5453;
  return s - Math.floor(s);
}

/* --- шум: ровно как в PlanetIconGenerator ---------------------------------- */
function noise(x, y, seed) {
  const s = Math.sin(x * 12.9898 + y * 78.233 + (seed % 65536)) * 43758.5453;
  return s - Math.floor(s);
}
function smoothNoise(x, y, seed) {
  const xi = Math.floor(x), yi = Math.floor(y);
  const xf = x - xi, yf = y - yi;
  const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
  const n00 = noise(xi, yi, seed), n10 = noise(xi + 1, yi, seed);
  const n01 = noise(xi, yi + 1, seed), n11 = noise(xi + 1, yi + 1, seed);
  const a = n00 + (n10 - n00) * u, b = n01 + (n11 - n01) * u;
  return a + (b - a) * v;
}
function fbm(x, y, seed) {
  return smoothNoise(x, y, seed) * 0.55
       + smoothNoise(x * 2.1 + 5.3, y * 2.1 + 1.7, seed + 31) * 0.28
       + smoothNoise(x * 4.3 + 9.1, y * 4.3 + 3.3, seed + 67) * 0.17;
}

/* --- HSV: процедурная палитра ---------------------------------------------- */
function rgb2hsv(c) {
  const r = c[0] / 255, g = c[1] / 255, b = c[2] / 255;
  const max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min;
  let h = 0;
  if (d > 1e-5) {
    if (max === r) h = ((g - b) / d) % 6;
    else if (max === g) h = (b - r) / d + 2;
    else h = (r - g) / d + 4;
    h *= 60;
    if (h < 0) h += 360;
  }
  return [h, max <= 0 ? 0 : d / max, max];
}
function hsv2rgb(h, s, v) {
  const c = v * s, x = c * (1 - Math.abs(((h / 60) % 2) - 1)), m = v - c;
  let r = 0, g = 0, b = 0;
  const seg = Math.floor(h / 60) % 6;
  if (seg === 0) { r = c; g = x; } else if (seg === 1) { r = x; g = c; }
  else if (seg === 2) { g = c; b = x; } else if (seg === 3) { g = x; b = c; }
  else if (seg === 4) { r = x; b = c; } else { r = c; b = x; }
  return [(r + m) * 255, (g + m) * 255, (b + m) * 255];
}
function tint(c, hueDeg, satMul, valMul) {
  const hsv = rgb2hsv(c);
  return hsv2rgb((hsv[0] + hueDeg + 360) % 360, clamp(hsv[1] * satMul, 0, 1), clamp(hsv[2] * valMul, 0, 1));
}

const GAS = [
  0xD8B685, 0x9E6538, // песочный
  0x6FC8D8, 0x2E7C9A, // бирюзовый
  0xD88A9A, 0x8A3A5A, // розово-бордовый
  0xC8A0E0, 0x6A4A9A, // фиолетовый
  0xE8C060, 0xA06028, // золотой
  0x8AC8A0, 0x3A7A5A, // зелёный
];
const HEAT = [[0x8A, 0x0A, 0x00], [0xD8, 0x30, 0x00], [0xB0, 0x12, 0x00], [0xE0, 0x80, 0x00],
              [0xFF, 0xD0, 0x40], [0xFF, 0xFF, 0xFF], [0xFF, 0xF0, 0xB0]];
const HEAT_AT = [0, 0.22, 0.38, 0.52, 0.66, 0.82, 1];
function heatColor(h) {
  for (let i = 0; i < HEAT_AT.length - 1; i++) {
    if (h <= HEAT_AT[i + 1]) {
      const t = (h - HEAT_AT[i]) / Math.max(0.001, HEAT_AT[i + 1] - HEAT_AT[i]);
      return lerp(HEAT[i], HEAT[i + 1], t);
    }
  }
  return HEAT[HEAT.length - 1];
}

/* --- параметры мира из сида ------------------------------------------------- */
/* Радиус диска с запасом под ореол атмосферы и линии поля. */
// Выбранное «Размер» — это диаметр планеты по экватору в пикселях,
// а холст берём на 18 % больше, чтобы в него влезли ореол и сияние.
const DISC_PAD = 1.18;
const sideFor = discPx => Math.round(discPx * DISC_PAD);
function planetRadius(side) { return side / DISC_PAD / 2; }

function gasParams(seed, tempC, size) {
  const s = Math.abs(Math.floor(seed)) || 1;
  const fam = (s % 6) * 2;
  const hue = h01(s, 1) * 44 - 22;
  const sat = 0.80 + h01(s, 2) * 0.40;
  const val = 0.88 + h01(s, 3) * 0.26;
  const climate = tempC < 150 ? [159, 216, 255]
    : tempC < 350 ? [220, 232, 242]
    : tempC < 800 ? [90, 74, 154]
    : tempC < 1300 ? [138, 42, 42] : [200, 90, 24];
  const p = {
    base: lerp(tint(hex(GAS[fam]), hue, sat, val), climate, 0.18),
    detail: lerp(tint(hex(GAS[fam + 1]), hue, sat, val), climate, 0.22),
    bandFreq: 14 + Math.floor(h01(s, 4) * 22),
    distort: 0.55 + h01(s, 5) * 1.5,
    softness: h01(s, 6),
    widenAmp: 0.45 + h01(s, 7) * 0.55,
    spots: [], smalls: [],
    hex: false,
    heatG: 0, heatRgb: [0, 0, 0],
  };
  p.heatG = Math.pow(clamp((tempC - 900) / 1400, 0, 1), 0.7);
  p.heatRgb = heatColor(clamp((tempC - 900) / 1800, 0, 1));
  p.hex = h01(s, 8) < 0.10 && tempC >= -150 && tempC <= 10;

  const radius = planetRadius(size);
  const storms = 1 + Math.floor(h01(s, 9) * 3);
  for (let i = 0; i < storms; i++) {
    const a = h01(s, 20 + i * 5) * Math.PI * 2;
    const d = radius * (0.20 + h01(s, 21 + i * 5) * 0.26);
    const rx = size * (0.045 + h01(s, 22 + i * 5) * 0.045);
    const ry = rx * (0.50 + h01(s, 23 + i * 5) * 0.24);
    p.spots.push({ x: Math.cos(a) * d, y: Math.sin(a) * d * 0.62, rx, ry,
                   u: Math.cos(a) * d / size, v: Math.sin(a) * d * 0.62 / size,
                   ru: rx / size, rv: ry / size });
  }
  const nSmall = 2 + Math.floor(h01(s, 10) * 4);
  for (let i = 0; i < nSmall; i++) {
    const a = h01(s, 40 + i * 4) * Math.PI * 2;
    const d = radius * (0.15 + h01(s, 41 + i * 4) * 0.55);
    p.smalls.push({ x: Math.cos(a) * d, y: Math.sin(a) * d * 0.8,
                    rx: size * (0.012 + h01(s, 42 + i * 4) * 0.018),
                    ry: size * (0.008 + h01(s, 43 + i * 4) * 0.012) });
  }
  return p;
}

function rockyParams(seed, tempC, size) {
  const s = Math.abs(Math.floor(seed)) || 1;
  const hot = tempC > 250;
  const icy = tempC < -80;
  const p = hot
    ? { base: [138, 66, 42], detail: [168, 86, 56], ocean: [56, 20, 14], dry: true, caps: false, cap: 1 }
    : icy
      ? { base: [200, 228, 240], detail: [232, 246, 252], ocean: [31, 53, 72], dry: false, caps: true, cap: 0.5 }
      : { base: [69, 104, 78], detail: [94, 140, 104], ocean: [24, 56, 92], dry: false, caps: true, cap: 0.7 };
  const hue = h01(s, 11) * 40 - 20;
  p.base = tint(p.base, hue, 0.85 + h01(s, 12) * 0.3, 0.9 + h01(s, 13) * 0.2);
  p.detail = tint(p.detail, hue, 0.85 + h01(s, 12) * 0.3, 0.9 + h01(s, 13) * 0.2);
  p.continentFreq = 3.6 + h01(s, 14) * 2.4;
  p.detailFreq = 5.0 + h01(s, 15) * 2.1;
  p.landThreshold = 0.46 + h01(s, 16) * 0.12;
  return p;
}

/* --- отрисовка -------------------------------------------------------------- */
function pixelSizeFor(kind, size) {
  const sel = document.getElementById("pix").value;
  if (sel !== "auto") return parseInt(sel, 10);
  // Раньше у каменных планет шаг был size/32: 128, 256 и 512 давали одну и ту же
  // сетку из 32 клеток, и «размер» ничего не менял. Теперь шаг общий: size/256,
  // то есть 256 — честный пиксель, 512 — блок 2 px для скачивания крупнее.
  return Math.max(1, Math.round(size / 256));
}

// Истинные размеры текстур в моде, не подогнанные под генератор:
//   каменная планета  PlanetIconGenerator.SIZE = 128
//   газовый гигант    PlanetIconGenerator.SIZE_GAS = 256
//   луна/мелкий диск  MapPixelSizing.MOON_STEPS = 8/16/24/36/48, SoftDiscTexture = 64
//   небо              SIZE_SKY = 512
// Генератор обязан уметь 36 и 64, а не требовать от мода 128.
const TRUE_SIZES = { gas: [256, 512], rocky: [36, 64, 128] };
function trueTextureSize(kind, discPx) {
  const list = TRUE_SIZES[kind === "gas" ? "gas" : "rocky"];
  const d = Number(discPx) || 0;
  let best = list[0];
  for (const s of list) if (s <= d) best = s;
  return best;
}
function textureInfo(kind, discPx) {
  const trueSize = trueTextureSize(kind, discPx);
  const pixel = Math.max(1, Math.round(discPx / trueSize));
  const native = Math.abs(pixel - 1) < 1e-9;
  return {
    pixel: pixel, cells: trueSize, disc: discPx, trueSize: trueSize, native: native,
    text: "диск " + discPx + " px · текстура мода " + trueSize + " px"
      + (native ? " · 1:1" : " · апскейл ×" + pixel)
  };
}

function render(size, seed, tempC, kind, tiltDeg) {
  const pixel = pixelSizeFor(kind, size);
  const radius = planetRadius(size);
  const cx = size / 2, cy = size / 2;
  const tilt = tiltDeg * Math.PI / 180;
  const ca = Math.cos(tilt), sa = Math.sin(tilt);
  const img = ctx.createImageData(size, size);
  const data = img.data;

  const P = kind === "gas" ? gasParams(seed, tempC, size) : rockyParams(seed, tempC, size);

  for (let y = 0; y < size; y += pixel) {
    for (let x = 0; x < size; x += pixel) {
      const dx = x - cx + pixel / 2, dy = y - cy + pixel / 2;
      if (dx * dx + dy * dy > radius * radius) continue;

      const nx = x / size, ny = y / size;
      const hu = (ca * (x - cx) - sa * (y - cy)) / size;
      const hv = (sa * (x - cx) + ca * (y - cy)) / size;
      let col;

      if (kind === "gas") {
        let gu = hu, gv = hv;
        for (const sp of P.spots) {
          const du = (hu - sp.u) / sp.ru, dv = (hv - sp.v) / sp.rv;
          const dd = du * du + dv * dv;
          if (dd >= 6) continue;
          const tw = 1.3 * Math.exp(-dd * 1.3);
          const c2 = Math.cos(tw), s2 = Math.sin(tw);
          const r1 = hu - sp.u, r2 = hv - sp.v;
          gu = sp.u + r1 * c2 - r2 * s2;
          gv = sp.v + r1 * s2 + r2 * c2;
        }
        const q1 = fbm(gu * 2.6 + 11, gv * 5 + 5, seed ^ 0x51AB) - 0.5;
        const q2 = fbm(gu * 5.5 + 3, gv * 11 + 9, seed ^ 0x99CD) - 0.5;
        gv += (q1 * 0.030 + q2 * 0.010) * P.distort;

        const widen = 1 + (fbm(gu * 1.5 + 12.3, gv * 1.5 + 5.1, seed ^ 0x77C1) - 0.5) * P.widenAmp;
        const n = (gv + 0.5) * P.bandFreq * widen + seed * 0.02;
        const wave = Math.sin(n);
        const t = wave * 0.5 + 0.5;
        if (t > 0.88) col = adjust(P.base, 30);
        else if (t > 0.58) col = P.base;
        else if (t > 0.36) col = lerp(P.base, P.detail, 0.45);
        else if (t > 0.15) col = lerp(P.base, P.detail, 0.85);
        else col = adjust(P.detail, -14);

        if (P.softness > 0.01) col = lerp(col, lerp(P.detail, P.base, t), P.softness * 0.65);

        // градиенты: поперёк пояса, по широте, полярная пелена
        col = shade(col, 0.95 + 0.10 * t);
        const lat = Math.abs(dy) / radius;
        col = shade(col, 1 - 0.18 * lat * lat);
        const polar = clamp((lat - 0.78) / 0.22, 0, 1);
        col = lerp(col, adjust(P.detail, -30), 0.35 * polar);

        if (P.hex) {
          const hx = (x - cx) / (size * 0.13), hy = (y - cy + radius * 0.86) / (size * 0.062);
          const hd = Math.max(Math.abs(hy), 0.866 * Math.abs(hx) + 0.5 * Math.abs(hy));
          if (hd < 1.25) {
            let k = clamp((1.25 - hd) / 0.45, 0, 1);
            k = k * k * (3 - 2 * k);
            col = lerp(col, adjust(P.detail, -25), 0.45 * k);
            const rim = clamp((hd - 0.75) / 0.30, 0, 1) * clamp((1.20 - hd) / 0.25, 0, 1);
            col = adjust(col, 22 * rim);
          }
        }
        for (const sm of P.smalls) {
          const ex = (x - cx - sm.x) / sm.rx, ey = (y - cy - sm.y) / sm.ry;
          const d2 = ex * ex + ey * ey;
          if (d2 < 1) col = lerp(col, adjust(P.detail, 28), 0.45 * (1 - d2) * (1 - d2));
        }
        for (const sp of P.spots) {
          const ex = (x - cx - sp.x) / sp.rx, ey = (y - cy - sp.y) / sp.ry;
          const d2 = ex * ex + ey * ey;
          if (d2 > 1) continue;
          const cu = (hu - sp.u) / (sp.ru * 0.30), cv = (hv - sp.v) / (sp.rv * 0.30);
          if (cu * cu + cv * cv < 1) col = adjust(col, 16);
          else col = lerp(col, lerp(P.detail, P.base, 0.30), 0.55 * (1 - d2) * (1 - d2));
        }
        // цвет пояса гуляет вдоль полосы
        col = adjust(col, (fbm(gu * 2.2 + 3, gv * 2.2 + 7, seed ^ 0xAB12) - 0.5) * 30);

        // раскалённые пояса, затем основа: см. heatGas
        col = heatGas(col, tempC, t, gu, gv, seed);
        const heatLit = heatStages(tempC, "gas").strength > 0.01;
        // облака и ветер
        col = clouds(col, gu, gv, seed);
        let light = Math.max(0.30, 0.95 - Math.sqrt(dx * dx + dy * dy) / radius * 0.45
                             - Math.max(0, dx / radius) * 0.22);
        if (heatLit) light = 1;
        light *= relief(gu, gv, seed);
        col = shade(col, light);
      } else {
        // каменная планета
        const wob = (fbm(nx * 3.4 + 31, ny * 3.4 + 17, seed ^ 0x6B6B) - 0.5) * 0.9;
        const n = smoothNoise(nx * P.continentFreq + wob, ny * P.continentFreq + wob * 0.7, seed);
        const n3 = smoothNoise(nx * P.detailFreq + 20, ny * P.detailFreq + 20, seed);
        const land = n > (P.dry ? 0.25 : P.landThreshold);
        const l3 = n3 > 0.58 && n3 < 0.85;
        col = P.dry ? P.base : P.ocean;
        if (P.dry) { if (land) col = P.detail; if (l3) col = adjust(P.detail, -20); }
        else if (land && l3) col = P.detail;
        else if (land) col = lerp(P.base, P.detail, 0.5);
        if (P.caps) {
          const en = smoothNoise(nx * 18, ny * 18, seed) - 0.5;
          const edge = radius * P.cap + en * radius * 0.08;
          if (Math.abs(dy) > edge) col = lerp(col, [234, 246, 255], 0.75);
        }
        col = clouds(col, nx, ny, seed, false);
        col = heatRocky(col, tempC, nx, ny, seed);
        const dist = Math.sqrt(dx * dx + dy * dy) / radius;
        let light = Math.max(0.30, 0.95 - dist * 0.45 - Math.max(0, dx / radius) * 0.22);
        light *= relief(nx, ny, seed, false);
        // Раскалённая кора светит сама: затемнение терминатора к ней не применяем,
        // иначе на правом лимбе горячая планета уходила в 0.30 яркости.
        if (HOT_ROCKY(tempC)) light = 1;
        col = shade(col, light);
      }

      // Атмосфера по воздушной массе: у лимба луч проходит в десятки раз
      // больший путь, поэтому край яркий и цветной, а центр почти чист.
      if (ATM.tau > 0) {
        const rr = Math.sqrt(dx * dx + dy * dy) / radius;
        const mu = Math.sqrt(Math.max(2e-3, 1 - rr * rr));
        // У горизонта путь растёт быстрее плоской модели: (1/mu)^1.35.
        const airmass = Math.min(40, Math.pow(1 / mu, 1.35));
        const veil = 1 - Math.exp(-ATM.tau * airmass);
        col = lerp(col, ATM.rgb, clamp(veil * ATM.gain, 0, 0.92));
      }

      const r = clamp(col[0] | 0, 0, 255), g = clamp(col[1] | 0, 0, 255), b = clamp(col[2] | 0, 0, 255);
      for (let py = 0; py < pixel; py++) {
        for (let px = 0; px < pixel; px++) {
          const tx = x + px, ty = y + py;
          if (tx >= size || ty >= size) continue;
          const i = (ty * size + tx) * 4;
          data[i] = r; data[i + 1] = g; data[i + 2] = b; data[i + 3] = 255;
        }
      }
    }
  }
  return img;
}

function relief(hu, hv, seed, gas = true) {
  const v = gas
    ? fbm(hu * 6 + 21, hv * 26 + 14, seed ^ 0x2B2B) * 0.62 + fbm(hu * 2.5 + 5, hv * 14 + 3, seed ^ 0x7E77) * 0.38
    : fbm(hu * 5.5 + 21, hv * 5.5 + 14, seed ^ 0x2B2B);
  return 0.92 + v * 0.16;
}

function clouds(col, hu, hv, seed, gas = true) {
  const scale = gas ? 9 : 4.2;
  const wx = hu * scale + (fbm(hu * 2.2 + 9, hv * 2.2 + 2, seed ^ 0x1234) - 0.5) * 1.5;
  const wy = hv * scale + (fbm(hu * 2.2 + 3, hv * 2.2 + 7, seed ^ 0x5678) - 0.5) * 1.5;
  const c = fbm(wx, wy, seed ^ 0xC10D);
  const thr = gas ? 0.56 : 0.62;
  if (c > thr) return lerp(col, [242, 247, 255], Math.min(gas ? 0.12 : 0.26, (c - thr) / (1 - thr) * (gas ? 0.26 : 0.44)));
  if (c > thr - 0.09) return lerp(col, [20, 23, 27], (thr - c) / 0.09 * 0.06);
  return col;
}

/* Нагрев по спецификации «термофизика планет» (см. docs): пороги в кельвинах.
   Точка Дрейпера 798 K — с неё твёрдое тело заметно светится. Каменные:
   750–1000 вишнёвая кора с первыми трещинами, 1000–1350 бурая кора + яркие
   жёлто-оранжевые разломы, 1350–1850 оранжевый накал, 1850–2400 жёлтый.
   Газовые: пояса греются вдвое глубже зон и вспыхивают первыми; основа
   уходит в магенту из-за провала зелёного в крыле Na I D (650–1000 K). */
function sstep(a, b, x) {
  const t = clamp((x - a) / (b - a), 0, 1);
  return t * t * (3 - 2 * t);
}

function heatStages(tempC, kind) {
  const Tk = (Number(tempC) || 0) + 273.15;
  if (kind === "gas") {
    return {
      belts: sstep(500, 850, Tk),
      base: sstep(1050, 1450, Tk),
      orange: sstep(1450, 2000, Tk),
      yellow: sstep(2000, 2600, Tk),
      strength: sstep(1200, 2400, Tk)
    };
  }
  return {
    red: sstep(750, 1000, Tk),
    deep: sstep(1000, 1350, Tk),
    cracks: Math.pow(clamp((Tk - 780) / (1450 - 780), 0, 1), 1.8),
    orange: sstep(1350, 1850, Tk),
    yellow: sstep(1850, 2400, Tk),
    strength: sstep(1350, 2400, Tk)
  };
}

/* Кора уже пламенеет: затемнение терминатора к ней не применяем. */
function HOT_ROCKY(tempC) {
  const H = heatStages(tempC, "rocky");
  return H.orange > 0.01 || H.yellow > 0.01;
}

function thermalGlow(tempC) {
  if (!window.EUThermal) return { color: [255, 150, 60], strength: 0 };
  const v = window.EUThermal.visible(tempC);
  return { color: v.color.map(c => c * 255), strength: v.strength };
}

/* Маска трещин 0…1: узкие жилы там, где шум близок к нулю. */
function crackMask(nx, ny, seed) {
  const cn = Math.abs(fbm(nx * 11 + 7, ny * 11 + 3, seed ^ 0x7A11) - 0.5)
    + Math.abs(fbm(nx * 27 + 2, ny * 27 + 9, seed ^ 0x5C33) - 0.5) * 0.45;
  return clamp(1 - cn / 0.075, 0, 1);
}

/* Каменная планета: кора краснеет, трещины светятся ярче коры.
   Важно: краснение НЕ затемняет. Раньше здесь был переход в #3B0502/#8A1404,
   и при 800–1350 K планета гасла почти в чёрный, хотя по Планку её свечение
   ещё ничтожно. Владелец требует «горячие всегда яркие», поэтому кора уходит
   в насыщенное красное, а накал задаётся аддитивно, с видимой планкой. */
function heatRocky(col, tempC, nx, ny, seed) {
  const H = heatStages(tempC, "rocky");
  if (H.red <= 0 && H.cracks <= 0 && H.orange <= 0 && H.yellow <= 0) return col;
  const Tk = (Number(tempC) || 0) + 273.15;
  let out = col;
  if (H.red > 0) out = lerp(out, [172, 52, 28], 0.50 * H.red);       // тёмно-вишнёвая, но живая
  if (H.deep > 0) out = lerp(out, [206, 86, 32], 0.42 * H.deep);     // буро-красная
  if (H.cracks > 0.002) {
    const vein = crackMask(nx, ny, seed);
    if (vein > 0) {
      // В жилах обнажена магма: T = max(Tпов, Tсолидус + 250 K). Жила должна быть
      // ЯРЧЕ коры, поэтому ведём её к жёлто-оранжевому, а не к планковскому красному.
      const crackT = Math.max(Tk, 1250 + 250) - 273.15;
      const emit = thermalGlow(crackT);
      const target = lerp(emit.color, [255, 208, 92], 0.65);
      out = lerp(out, target, clamp(Math.pow(vein, 0.55) * (0.35 + 0.85 * H.cracks), 0, 0.97));
    }
  }
  if (H.orange > 0) {
    const glow = thermalGlow(tempC);
    const w = Math.max(glow.strength * 0.85, 0.38 * H.orange);        // планка видимости
    out = addc(out, glow.color, w);
  }
  if (H.yellow > 0) {
    // Отдельная золотисто-жёлтая стадия: Планк при 1850–2400 K ещё оранжевый,
    // поэтому жёлтый подмешиваем явно, иначе двух стадий просто нет.
    out = lerp(out, [255, 232, 150], 0.50 * H.yellow);
    const glow = thermalGlow(tempC);
    out = addc(out, [255, 226, 140], 0.30 * H.yellow);
  }
  return out;
}

/* Газовая планета: пояса вспыхивают первыми, основа подтягивается позже.
   Никакого сдвига в магенту — владелец отверг его как плохой дизайн. */
function heatGas(col, tempC, band, gu, gv, seed) {
  const H = heatStages(tempC, "gas");
  if (H.belts <= 0.001 && H.base <= 0.001) return col;
  const Tk = (Number(tempC) || 0) + 273.15;
  let out = col;
  // Никакого сдвига в магенту: владелец сказал, что это выглядит как авария
  // дизайна. Цвет атмосферы теперь даёт настоящий лимб (атмосферная масса).
  // Пояса (тёмные полосы) лежат глубже зон: T ≈ 2·T_eff.
  const mBelt = clamp(1 - band / 0.5, 0, 1);
  const beltJitter = 0.75 + 0.5 * fbm(gu * 6 + 4, gv * 6 + 1, seed ^ 0x3311);
  const Tlocal = Tk * (1 + 1.0 * mBelt * beltJitter);
  const emit = thermalGlow(Tlocal - 273.15);
  const strength = emit.strength * (0.35 + 0.65 * mBelt) * Math.max(0.25, H.belts);
  if (strength > 0.01) out = addc(out, emit.color, 0.85 * strength);
  if (H.base > 0) out = lerp(out, [176, 66, 28], 0.45 * H.base);
  if (H.strength > 0) {
    const glow = thermalGlow(tempC);
    out = addc(out, glow.color, 0.75 * H.strength * Math.max(0.35, glow.strength));
  }
  return out;
}
/* --- атмосфера -------------------------------------------------------------- */
function rgba3(c, a) {
  return "rgba(" + (c[0] | 0) + "," + (c[1] | 0) + "," + (c[2] | 0) + ","
       + clamp(a, 0, 1).toFixed(3) + ")";
}

/* Цвет ореола от температуры: холодные — голубой, тёплые — оранжевый,
   у раскалённых ореол становится собственным свечением планеты. */
function atmosphereColor(tempC, composition = '', kind = 'rocky') {
  const hot = heatStages(tempC, kind);
  if (hot.strength > 0.02) {
    const glow = thermalGlow(tempC);
    return lerp(atmosphereColorBase(tempC, composition), glow.color, Math.min(0.85, hot.strength));
  }
  return atmosphereColorBase(tempC, composition);
}

function atmosphereColorBase(tempC,composition='') {
  const c=String(composition).toUpperCase();
  if(/SO2|H2S|S2/.test(c))return[236,214,72];
  if(/CH4|C2H6|HCN/.test(c))return[78,181,206];
  if(/CO2/.test(c)&&!/O2/.test(c))return[214,154,105];
  if(/CL2|F2/.test(c))return[154,224,120];
  const cold=[112,190,255],mid=[176,226,255],warm=[255,150,82],t=clamp((tempC+60)/380,0,1);
  return t<.5?lerp(cold,mid,t*2):lerp(mid,warm,(t-.5)*2);
}

/* Собственное свечение вокруг диска: у раскалённых планет спрайт всегда яркий,
   с жёлтым ободком, даже если атмосферы нет. */
function drawThermalGlow(bctx, size, tempC, kind) {
  const H = heatStages(tempC, kind);
  if (H.strength <= 0.01) return;
  const glow = thermalGlow(tempC);
  const R = planetRadius(size), c = size / 2;
  const outer = R * (1.04 + 0.32 * H.strength);
  const a = 0.60 * H.strength * Math.max(0.4, glow.strength);
  const g = bctx.createRadialGradient(c, c, R * 0.90, c, c, outer);
  g.addColorStop(0, rgba3(glow.color, a));
  g.addColorStop(0.42, rgba3(glow.color, a * 0.42));
  g.addColorStop(1, rgba3(glow.color, 0));
  bctx.save();
  bctx.globalCompositeOperation = "lighter";
  bctx.fillStyle = g;
  bctx.beginPath();
  bctx.arc(c, c, outer, 0, Math.PI * 2);
  bctx.fill();
  bctx.restore();
}

/* Атмосфера как реальный лимб, а не сдвиг цвета.
   Количество газа на луче зрения растёт как воздушная масса 1/cosθ: в центре
   диска луч идёт вертикально и атмосфера почти не видна, у края — сквозь
   десятки толщ, поэтому лимб яркий и цветной. Так это и выглядит на снимках
   Земли. Цвет даёт рэлеевское рассеяние по составу, яркость и толщина — по
   классу плотности. */
function atmosphereModel(atm, tempC, composition) {
  // Плотность — ОДНА таблица на страницу, ровно как ATM_DENSITY (Java .15/.35/.55/.75/.90):
  // раньше лимб и сияние считали разную толщу газа.
  const density = ATM_DENSITY[atm] || 0;
  if (!density) return { tau: 0, rgb: [0, 0, 0], gain: 0, halo: 0, density: 0 };
  const c = String(composition || '').toUpperCase();
  // Состав разбираем на формулы: подстрока «O2» есть и внутри «CO2», из-за чего
  // марсианская углекислая атмосфера раньше красилась в земной синий.
  const toks = new Set(c.split(/[^A-Z0-9]+/).filter(Boolean));
  const has = (...names) => names.some(n => toks.has(n));
  let rgb = [96, 150, 236];                        // N2/O2 — синий, как у Земли
  if (has('SO2', 'H2S')) rgb = [235, 212, 96];     // серная кислота — жёлтая
  else if (has('CH4', 'C2H6', 'HCN')) rgb = [88, 200, 216];
  else if (has('CO2') && !has('O2')) rgb = [208, 180, 142];   // пыльная взвесь
  else if (has('H2', 'HE') && !has('O2')) rgb = [176, 196, 226];
  // Мощность: плотность и нагрев. Тонкая атмосфера даёт узкую кромку,
  // плотная — широкую и яркую, вплоть до «съеденного» края диска.
  const gain = clamp(0.75 + 0.40 * clamp((tempC + 80) / 420, 0, 1), 0, 1.15);
  return { tau: density * 0.16, rgb: rgb, gain: gain, halo: density, density: density };
}

let ATM = { tau: 0, rgb: [0, 0, 0], gain: 0, halo: 0, density: 0 };
let ATM_TEMP = 0;

function drawAtmosphere(bctx, size, atm, tempC, composition, cloudiness, kind) {
  const m = atmosphereModel(atm, tempC, composition);
  const s = m.halo;
  if (!s) return;
  const R = planetRadius(size), c = size / 2;
  const col = m.rgb;
  // Ореол за диском: чем мощнее атмосфера, тем дальше он уходит от края.
  const outer = R * (1.02 + 0.16 * s);
  const g = bctx.createRadialGradient(c, c, R * 0.95, c, c, outer);
  g.addColorStop(0, rgba3(col, 0.55 * s));
  g.addColorStop(0.30, rgba3(col, 0.28 * s));
  g.addColorStop(0.66, rgba3(col, 0.09 * s));
  g.addColorStop(1, rgba3(col, 0));
  bctx.fillStyle = g;
  bctx.beginPath();
  bctx.arc(c, c, outer, 0, Math.PI * 2);
  bctx.fill();
  // Тонкая кайма по самому лимбу — то, что видно на снимке Земли.
  bctx.strokeStyle = rgba3(col, 0.34 * s);
  bctx.lineWidth = Math.max(1, size / 320 * (1 + 1.5 * s));
  bctx.beginPath();
  bctx.arc(c, c, R + 0.5, 0, Math.PI * 2);
  bctx.stroke();

}

/* Облака: семейства те же, что в моде (PlanetCloudMath: WISPS, CUMULUS, FRONTS,
   CYCLONE, BROKEN_OVERCAST, POLAR_EYEBALL). Рисуем в сетке размером с пиксель
   текстуры, поэтому разрешение планеты действительно меняет структуру облаков. */
function autoCloudFamily(p) {
  const t = p.tempC, d = ATM_DENSITY[p.atm] || 0, giant = p.kind === "gas";
  const comp = String(p.composition || "").toUpperCase();
  const sulfur = /SO2|H2S/.test(comp), mineral = /(^|[,;])\s*(FE|SI|SIO|SIO2)/.test(comp);
  if (d <= 0) return "none";
  if (d < .4 || mineral || (t > 80 && !sulfur)) return "wisps";
  if (t < -35 && !giant) return "eyeball";
  if (sulfur || (d >= .75 && t < 30)) return "overcast";
  if (giant || t <= 5 || d >= .70) return "fronts";
  return "cumulus";
}

function cloudFamilyFor(p) {
  return p.cloudType && p.cloudType !== "auto" ? p.cloudType : autoCloudFamily(p);
}

function drawCloudOverlay(c2, size, cloudiness, composition, seed, family, pixel) {
  if (!(cloudiness > 0) || !family || family === "none") return;
  const R = planetRadius(size), step = Math.max(1, Math.round(pixel || 1));
  const cells = Math.max(16, Math.round(size / step));
  const off = document.createElement("canvas");
  off.width = off.height = cells;
  const o = off.getContext("2d");
  const cx = cells / 2, cy = cells / 2, rc = cells / 2 * (R / (size / 2));
  const tint = /CH4|NH3/i.test(String(composition || "")) ? "196,224,238" : "244,248,255";
  const alpha = 0.10 + 0.55 * cloudiness;
  const rnd = k => h01(seed, k + 300);
  const cell = (x, y, a) => {
    const dx = x + .5 - cx, dy = y + .5 - cy;
    if (dx * dx + dy * dy > rc * rc) return;
    o.fillStyle = "rgba(" + tint + "," + a.toFixed(3) + ")";
    o.fillRect(x, y, 1, 1);
  };
  // Сколько деталей даёт разрешение: крупнее текстура — мельче структура.
  const density = cells / 64;
  if (family === "wisps") {
    // Дымка: рваные полосы, а не сплошные скан-линии по всему диску.
    for (let y = 0; y < cells; y++) {
      const ph = rnd(y) * 6.283;
      for (let x = 0; x < cells; x++) {
        const patch = fbm(x / cells * 3.1 + 11, y / cells * 5.7 + 4, seed ^ 0x5157);
        if (patch < 0.46) continue;
        const wave = Math.sin(x / cells * 6.5 + ph) * .5 + .5;
        const a = alpha * .55 * (patch - 0.46) / 0.54 * (0.35 + 0.65 * wave);
        if (a > 0.02) cell(x, y, a);
      }
    }
  } else if (family === "fronts") {
    for (let y = 0; y < cells; y++) {
      for (let x = 0; x < cells; x++) {
        const band = Math.sin((y / cells * 7 + Math.sin(x / cells * 3 + rnd(y) * 3) * .55) * Math.PI);
        const t = Math.abs(band);
        if (t > 1 - cloudiness * .9) cell(x, y, alpha * (1 - Math.abs(t - .55)));
      }
    }
  } else if (family === "cumulus") {
    const blobs = Math.round(20 * density * cloudiness + 5);
    for (let k = 0; k < blobs; k++) {
      // Центры тянем к поясам, а у лимба сжимаем по горизонтали: диск круглый.
      const v = (rnd(k * 7 + 2) * 2 - 1) * .82;
      const u = (rnd(k * 7 + 1) * 2 - 1) * .82 * Math.sqrt(Math.max(0, 1 - v * v));
      const z = Math.sqrt(Math.max(.04, 1 - u * u - v * v));
      const bx = cx + u * rc, by = cy + v * rc;
      const rr = (1.1 + rnd(k * 7 + 3) * 2.4) * (.7 + .6 * cloudiness);
      const rx = rr * (.35 + .65 * z);
      for (let y = Math.floor(by - rr); y <= by + rr; y++) {
        for (let x = Math.floor(bx - rx); x <= bx + rx; x++) {
          const dx = (x + .5 - bx) / Math.max(.3, rx), dy = (y + .5 - by) / rr;
          if (dx * dx + dy * dy <= 1) cell(x, y, alpha * (0.45 + 0.55 * rnd(x * 31 + y)));
        }
      }
    }
  } else if (family === "cyclone") {
    const arms = 3, turns = 2.4;
    for (let k = 0; k < arms; k++) {
      for (let s = 0; s < cells * 2.2; s++) {
        const f = s / (cells * 2.2);
        const ang = k * 6.283 / arms + f * turns * 6.283;
        const rr = rc * (0.15 + f * 0.85);
        const x = Math.round(cx + Math.cos(ang) * rr), y = Math.round(cy + Math.sin(ang) * rr * 0.92);
        cell(x, y, alpha * (0.85 - 0.5 * f));
        if (cloudiness > .5) cell(x + 1, y, alpha * .35);
      }
    }
  } else if (family === "overcast") {
    for (let y = 0; y < cells; y++) {
      for (let x = 0; x < cells; x++) {
        const n = Math.sin(x / cells * 6.1 + rnd(y) * 5) * Math.cos(y / cells * 4.7 + rnd(x) * 5);
        if (n > -0.92 + (1 - cloudiness)) cell(x, y, alpha * (0.35 + 0.55 * (n * .5 + .5)));
      }
    }
  } else if (family === "eyeball") {
    // Полярный глаз: сплошная шапка у подзвёздной точки, к краю редеет.
    for (let y = 0; y < cells; y++) {
      for (let x = 0; x < cells; x++) {
        const dx = x + .5 - cx, dy = y + .5 - cy, rr = Math.hypot(dx, dy) / rc;
        if (rr > .98) continue;
        const cap = 1 - rr;
        if (cap > .25 - cloudiness * .2) cell(x, y, alpha * Math.min(1, cap * 1.6));
      }
    }
  }
  c2.save();
  c2.beginPath();
  c2.arc(size / 2, size / 2, R, 0, Math.PI * 2);
  c2.clip();
  c2.imageSmoothingEnabled = false;
  c2.drawImage(off, 0, 0, size, size);
  c2.restore();
}

/* --- полярное сияние и магнитное поле: модель мода ------------------------- */
/* Плотность атмосферы и видимость ночью — те же таблицы, что в Java
   (PlanetAtmosphere.density и AuroraPowerMath.nightVisibility). */
const ATM_DENSITY = { none: 0, minimal: .15, thin: .35, moderate: .55, medium: .75, thick: .90 };

function auroraModel(kind, gauss, atm, p) {
  const A = window.EUAurora;
  const r = kind === "gas" ? 11.2 : 1;          // радиус в радиусах Земли
  const b = Math.max(0, gauss) / 0.5;           // B / 0.5 Гс
  const W = r * r * Math.pow(b, 2 / 3);         // a = 1 а.е.
  let I = W / (r * r);                          // поверхностная яркость
  if (kind === "gas") I *= 0.35;
  const density = ATM_DENSITY[atm] || 0;
  const vis = A.nightVisibility(atm);
  const seed = (p && p.seed) || 1;
  // Звезда на этой странице не выбирается, поэтому берём солнечный прокси.
  const source = A.stellarProxy("yellow_dwarf", 1, 5800);
  const distance = kind === "gas" ? 5.2 : 1;
  const env = A.sample({ radiusEarth: r, gauss: gauss, atmosphereDensity: density, night: vis, gas: kind === "gas" },
    source, distance, null, NaN);
  const pal = A.palette({
    composition: p && p.composition, category: kind === "gas" ? "gas_giant" : "habitable",
    planetSeed: seed, worldSeed: seed, density: density
  });
  const alpha = env.visibleEmission;
  const level = alpha <= 0.004 ? "none" : alpha < 0.045 ? "weak" : alpha < 0.11 ? "mid" : "bright";
  return { r: r, W: W, I: I, vis: vis, screen: alpha, alpha: alpha, level: level, env: env, palette: pal };
}

/* Ось диполя вращается вместе с планетой: азимут = сидовый сдвиг + фаза. */
function dipoleFrame(p, phase) {
  const A = window.EUAurora;
  const tilt = (p.magtilt || 0) * Math.PI / 180;
  const azimuth = h01((p.seed || 1), 41) * Math.PI * 2 + (phase || 0);
  const axis = A.magneticAxis(0, 1, 0, tilt, azimuth);
  const basis = A.basis(axis);
  return { axis: axis, u: basis[0], v: basis[1] };
}

/* Точка в системе планеты: r·(cosλ·m + sinλ·ось), m — направление меридиана. */
function fieldPoint(radius, latRad, m, axis) {
  const cl = Math.cos(latRad), sl = Math.sin(latRad), rr = radius;
  return [
    rr * (cl * m[0] + sl * axis[0]),
    rr * (cl * m[1] + sl * axis[1]),
    rr * (cl * m[2] + sl * axis[2])
  ];
}

function rgbaHex(hex, a) {
  return "rgba(" + ((hex >>> 16) & 255) + "," + ((hex >>> 8) & 255) + "," + (hex & 255) + "," + a.toFixed(3) + ")";
}

/* Овал сияния в 3D: широта из модели, три слоя палитры по высоте завесы.
   Раньше здесь были два плоских овала — теперь проекция настоящего кольца. */
function drawAurora(c2, size, p, model, phase) {
  if (!p || p.field <= 0.02 || !model || model.alpha <= 0.004) return;
  const A = window.EUAurora;
  const R = planetRadius(size), cx = size / 2, cy = size / 2;
  const frame = dipoleFrame(p, phase);
  const axis = frame.axis, u = frame.u, v = frame.v;
  const env = model.env, pal = model.palette;
  const lat = env.ovalLatitudeDeg * Math.PI / 180;
  const peak = clamp(model.alpha / A.VISIBLE_CAP, 0, 1);
  if (peak <= 0) return;
  const N = 120, shell = env.shell, curtain = env.curtainHeight;
  c2.save();
  c2.globalCompositeOperation = "lighter";
  c2.lineCap = "round";
  c2.lineJoin = "round";
  // Полосы идут по высоте завесы: ядро у овала, средний слой и верх — цвета палитры.
  const bands = [
    { alt: 0.14, off: 0.000, width: 0.030, alpha: 0.75 },
    { alt: 0.52, off: 0.022, width: 0.022, alpha: 0.42 },
    { alt: 0.90, off: 0.048, width: 0.015, alpha: 0.22 }
  ];
  for (const side of [1, -1]) {
    for (let b = bands.length - 1; b >= 0; b--) {
      const band = bands[b];
      const colour = A.colorAt(pal, band.alt, phase);
      const alpha = peak * band.alpha * 0.55;
      if (alpha < 0.012) continue;
      const radius = 1 + shell + band.off * (1 + curtain * 4);
      // Мягкое расширение, затем ядро: получается завеса, а не нитка.
      for (const pass of [{ w: band.width * 2.4, a: alpha * 0.26 }, { w: band.width, a: alpha }]) {
        c2.strokeStyle = rgbaHex(colour, Math.min(1, pass.a));
        c2.lineWidth = Math.max(1.5, R * pass.w * (1 + curtain * 2));
        c2.beginPath();
        let started = false;
        for (let i = 0; i <= N; i++) {
          const ph = i / N * Math.PI * 2;
          const m = [u[0] * Math.cos(ph) + v[0] * Math.sin(ph),
                     u[1] * Math.cos(ph) + v[1] * Math.sin(ph),
                     u[2] * Math.cos(ph) + v[2] * Math.sin(ph)];
          const q = fieldPoint(radius, side * lat, m, axis);
          if (q[2] <= 0) { started = false; continue; }
          const sx = cx + q[0] * R, sy = cy - q[1] * R;
          if (!started) { c2.moveTo(sx, sy); started = true; } else c2.lineTo(sx, sy);
        }
        c2.stroke();
      }
    }
  }
  // Занавеси: короткие лучи наружу, ярче у полюса.
  const rays = 84;
  for (let i = 0; i < rays; i++) {
    const ph = i / rays * Math.PI * 2;
    const m = [u[0] * Math.cos(ph) + v[0] * Math.sin(ph),
               u[1] * Math.cos(ph) + v[1] * Math.sin(ph),
               u[2] * Math.cos(ph) + v[2] * Math.sin(ph)];
    const fold = env.curtainFold * (0.45 + 0.55 * Math.abs(Math.sin(ph * 3 + phase * 2 + i)));
    for (const side of [1, -1]) {
      const inner = fieldPoint(1 + shell, side * lat, m, axis);
      const outer = fieldPoint(1 + shell + curtain * fold, side * lat, m, axis);
      if (inner[2] <= 0 && outer[2] <= 0) continue;
      const a = peak * 0.16 * (0.4 + 0.6 * fold);
      if (a < 0.01) continue;
      c2.strokeStyle = rgbaHex(A.colorAt(pal, 0.72, ph * 3 + phase), a);
      c2.lineWidth = Math.max(1, R * 0.006);
      c2.beginPath();
      c2.moveTo(cx + inner[0] * R, cy - inner[1] * R);
      c2.lineTo(cx + outer[0] * R, cy - outer[1] * R);
      c2.stroke();
    }
  }
  c2.restore();
}

/* Силовые линии диполя r = L·cos²λ в 3D: наклон, глубина и цвет из модели. */
function drawFieldLines(c2, size, p, phase) {
  if (!p || p.field <= 0.02) return;
  const A = window.EUAurora;
  const R = planetRadius(size), cx = size / 2, cy = size / 2;
  const frame = dipoleFrame(p, phase || 0);
  const axis = frame.axis, u = frame.u, v = frame.v;
  const pal = (p.palette || null) || A.palette({
    composition: p.composition, category: p.kind === "gas" ? "gas_giant" : "habitable",
    planetSeed: p.seed || 1, worldSeed: p.seed || 1, density: ATM_DENSITY[p.atm] || 0
  });
  const shells = clamp(3 + Math.round(Math.log1p(p.field) * 1.6), 3, 8);
  c2.save();
  c2.globalCompositeOperation = "lighter";
  c2.lineWidth = Math.max(1, size / 360);
  // Линии не проходят по диску — так поле читается как магнитосфера вокруг планеты.
  c2.beginPath();
  c2.rect(0, 0, size, size);
  c2.arc(cx, cy, R * 0.995, 0, Math.PI * 2);
  c2.clip("evenodd");
  for (let m = 0; m < 6; m++) {
    const ph = m / 6 * Math.PI * 2 + phase * 0.35;
    const mdir = [u[0] * Math.cos(ph) + v[0] * Math.sin(ph),
                  u[1] * Math.cos(ph) + v[1] * Math.sin(ph),
                  u[2] * Math.cos(ph) + v[2] * Math.sin(ph)];
    for (let s = 0; s < shells; s++) {
      const L = 1.30 + s * (1.9 / Math.max(1, shells - 1));
      const lat0 = Math.acos(Math.sqrt(1 / L));
      const colour = A.colorAt(pal, 0.5 - 0.35 * (s / Math.max(1, shells - 1)), ph);
      const segments = [];
      let run = [];
      for (let k = 0; k <= 48; k++) {
        const lam = -lat0 + 2 * lat0 * k / 48;
        const q = fieldPoint(L * Math.cos(lam) * Math.cos(lam), lam, mdir, axis);
        const onScreen = q[2] > 0 || (q[0] * q[0] + q[1] * q[1]) > 1;
        if (!onScreen) { if (run.length) { segments.push(run); run = []; } continue; }
        run.push([cx + q[0] * R, cy - q[1] * R, q[2]]);
      }
      if (run.length) segments.push(run);
      for (const seg of segments) {
        if (seg.length < 2) continue;
        const depth = clamp(seg.reduce((acc, pt) => acc + pt[2], 0) / seg.length * 0.5 + 0.5, 0, 1);
        c2.strokeStyle = rgbaHex(colour, 0.05 + 0.20 * depth * (1 - s / (shells + 1)));
        c2.beginPath();
        c2.moveTo(seg[0][0], seg[0][1]);
        for (let i = 1; i < seg.length; i++) c2.lineTo(seg[i][0], seg[i][1]);
        c2.stroke();
      }
    }
  }
  c2.restore();
}

/* --- панель ----------------------------------------------------------------- */
function current() {
  return {
    seed: parseInt(document.getElementById("seed").value, 10) || 1,
    tempC: parseFloat(document.getElementById("temp").value),
    size: parseInt(document.getElementById("size").value, 10),
    kind: document.getElementById("type").value,
    tilt: parseFloat(document.getElementById("tilt").value),
    atm: document.getElementById("atm").value,
    field: parseFloat(document.getElementById("field").value),
    magtilt: parseFloat(document.getElementById("magtilt").value),
    composition: document.getElementById("composition").value,
    habitable: document.getElementById("habitable").checked,
    clouds: parseFloat(document.getElementById("clouds").value),
    cloudType: document.getElementById("cloudtype").value
  };
}

const planetCv = document.createElement("canvas");
const baseCv = document.createElement("canvas");
const baseCtx = baseCv.getContext("2d");
let params = null, aurora = null, animStart = 0, rafId = 0, lastFrame = 0;

function fmtNum(v, digits = 0) {
  return EUI18N.num(v, { maximumFractionDigits: digits });
}
function fmt2(v) {
  return EUI18N.num(v, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
}

function updateControls(c) {
  document.getElementById("tempv").textContent = fmtNum(c.tempC);
  document.getElementById("fieldv").textContent = fmt2(c.field) + " " + T('p.unit.gs');
  document.getElementById("magtiltv").textContent = fmtNum(c.magtilt) + "°";
  document.getElementById("cloudsv").textContent=fmtNum(c.clouds*100)+"%";
}

function updateInfo(c, model) {
  const P = c.kind === "gas" ? gasParams(c.seed, c.tempC, c.size) : rockyParams(c.seed, c.tempC, c.size);
  const yes = T('yes');
  const no = T('no');
  const base = c.kind === "gas"
    ? T('p.info.gas', {
        seed: c.seed, bands: P.bandFreq,
        distort: P.distort.toFixed(2), softness: P.softness.toFixed(2),
        widen: P.widenAmp.toFixed(2), spots: P.spots.length, smalls: P.smalls.length,
        hex: P.hex ? yes : no,
        heat: P.heatG > 0.01 ? T('p.heat', { v: (P.heatG * 100).toFixed(0) }) : no
      })
    : T('p.info.rocky', {
        seed: c.seed,
        cont: P.continentFreq.toFixed(2), detail: P.detailFreq.toFixed(2),
        land: P.landThreshold.toFixed(2), caps: P.caps ? yes : no
      });
  const visible = c.field > 0.02 && model.alpha > 0.004;
  const auroraInfo = T('p.info.aurora', {
    atm: T('atm.' + c.atm),
    atmVis: fmtNum((ATM.density || 0) * 100),
    lat: fmtNum(model.env ? model.env.ovalLatitudeDeg : 0),
    b: fmt2(c.field),
    tilt: fmtNum(c.magtilt),
    level: c.field > 0.02 ? T('p.aur.' + model.level) : T('p.aur.none'),
    vis: fmtNum(visible ? model.vis : 0, 3)
  });
  const tex = textureInfo(c.kind, c.size);
  const texInfo = T('p.texture') + ': ' + tex.text;
  document.getElementById("info").textContent = base + "\n" + texInfo + "\n" + auroraInfo + "\n" + (c.habitable?"✓ ":"○ ") + T('p.hab.independent') + " · " + c.composition;
}

/* --- отрисовка: статичная база (ореол + планета), поверх — живое сияние ---- */
function paint(now) {
  if (!params || !aurora) return;
  const side = cv.width;                      // сторона холста, не диаметр диска
  const phase = reduceMotion.matches ? 0 : ((now - animStart) / AURORA_MS) * Math.PI * 2;
  ctx.clearRect(0, 0, side, side);
  ctx.drawImage(baseCv, 0, 0);
  drawAurora(ctx, side, params, aurora, phase);
  drawFieldLines(ctx, side, params, phase);
}

function stopAnimation() {
  if (rafId) cancelAnimationFrame(rafId);
  rafId = 0;
}

function tick(now) {
  rafId = requestAnimationFrame(tick);
  if (now - lastFrame < 33) return; // ~30 fps
  lastFrame = now;
  paint(now);
}

function startAnimation() {
  stopAnimation();
  animStart = performance.now();
  lastFrame = 0;
  paint(animStart);
  if (reduceMotion.matches) return;
  if (!aurora || !params || aurora.alpha <= 0.004 || params.field <= 0.02) return;
  rafId = requestAnimationFrame(tick);
}

if (reduceMotion.addEventListener) {
  reduceMotion.addEventListener("change", () => startAnimation());
}

function draw() {
  const c = current();
  // Атмосферу считаем ДО render(): иначе цвет лимба отстаёт на кадр.
  ATM = atmosphereModel(c.atm, c.tempC, c.composition);
  ATM_TEMP = c.tempC;
  const model = auroraModel(c.kind, c.field, c.atm, c);
  const SIDE = sideFor(c.size);
  cv.width = SIDE;
  cv.height = SIDE;
  baseCv.width = SIDE;
  baseCv.height = SIDE;
  planetCv.width = SIDE;
  planetCv.height = SIDE;
  planetCv.getContext("2d").putImageData(
    render(SIDE, c.seed, c.tempC, c.kind, c.tilt), 0, 0);
  baseCtx.clearRect(0, 0, SIDE, SIDE);
  drawAtmosphere(baseCtx, SIDE, c.atm, c.tempC, c.composition, c.clouds, c.kind);
  drawThermalGlow(baseCtx, SIDE, c.tempC, c.kind);
  baseCtx.drawImage(planetCv, 0, 0);
  const family = cloudFamilyFor(c);
  drawCloudOverlay(baseCtx, SIDE, c.clouds, c.composition, c.seed, family, textureInfo(c.kind, c.size).pixel);
  params = c;
  aurora = model;
  updateControls(c);
  updateInfo(c, model);
  startAnimation();
}

["seed", "temp", "size", "pix", "type", "tilt", "atm", "field", "magtilt", "composition", "habitable", "clouds", "cloudtype"].forEach((id) =>
  document.getElementById(id).addEventListener("input", () => {
    draw();
  }));

document.getElementById("rnd").addEventListener("click", () => {
  document.getElementById("seed").value = Math.floor(Math.random() * 999999) + 1;
  draw();
});

document.getElementById("save").addEventListener("click", () => {
  cv.toBlob((blob) => {
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    const c = current();
    a.download = `planet_${c.kind}_${c.seed}_${c.size}px.png`;
    a.click();
    URL.revokeObjectURL(a.href);
  });
});

document.getElementById("tempv").textContent = document.getElementById("temp").value;
EUI18N.init();
addEventListener("eu-lang", () => draw());
draw();
</script>
</body>
</html>
