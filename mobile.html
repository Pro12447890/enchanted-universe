<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="canonical" href="./">
<title>Enchanted Universe — карта космоса</title>
<script>
// Совместимость старых ссылок: единственная карта автоматически адаптируется.
const target = new URL('./', location.href);
target.search = location.search;
target.hash = location.hash;
target.searchParams.delete('desktop');
if (target.protocol === 'http:') target.protocol = 'https:';
location.replace(target.href);
</script>
</head>
<body><p><a href="./">Открыть карту Enchanted Universe</a></p></body>
</html>
